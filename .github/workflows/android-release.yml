name: Android Signed Release Verification

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check required signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          echo "All required signing secrets are present."

      - name: Restore and validate Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/rain-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Keystore file and requested alias validated."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          SIGNATURE_OUTPUT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNATURE_OUTPUT"

          EXPECTED_CERT_SHA256="d1b9587fd636c1e0e92a5718576381aadbc72190f5c927f45e7d4ebe0eadb592"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          echo "Verified release signing certificate SHA-256: $ACTUAL_CERT_SHA256"

          sha256sum "$APK_PATH"

      - name: Verify application identity and version metadata
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 "^package:")"
          read -r ACTUAL_APPLICATION_ID ACTUAL_VERSION_CODE ACTUAL_VERSION_NAME < <(
            printf '%s\n' "$PACKAGE_LINE" | awk -F"'" '{print $2, $4, $6}'
          )

          EXPECTED_APPLICATION_ID="com.rain.browser"
          EXPECTED_VERSION_CODE="2"
          EXPECTED_VERSION_NAME="0.1.1"

          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME"

          echo "Verified applicationId: $ACTUAL_APPLICATION_ID"
          echo "Verified versionCode: $ACTUAL_VERSION_CODE"
          echo "Verified versionName: $ACTUAL_VERSION_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rain-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rain-release.jks"
