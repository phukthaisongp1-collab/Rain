name: Phase 2 Build and Lint

on:
  push:
    branches:
      - "phase2/**"
  pull_request:
    branches:
      - "phase2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-build-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Android Lint and Debug Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew
      - name: Run Android lint and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug
