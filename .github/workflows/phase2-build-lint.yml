name: Phase 2 Build and Lint

on:
  push:
    branches:
      - "phase2/**"
  pull_request:
    branches:
      - "phase2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-build-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Android Lint and Debug Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up JDK 21 for unit tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Robolectric artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew
      - name: Configure per-test logging
        run: |
          cat > "$RUNNER_TEMP/test-logging.init.gradle" <<'EOF'
          import org.gradle.api.tasks.testing.Test

          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events "passed", "failed", "skipped"
                      showStandardStreams = false
                  }
              }
          }
          EOF
      - name: Run Android lint and assemble debug APK
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon --stacktrace -I "$RUNNER_TEMP/test-logging.init.gradle" -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_21_X64" lint testDebugUnitTest assembleDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day9-unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
