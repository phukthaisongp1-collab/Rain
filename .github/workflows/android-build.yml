name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Unit Tests, and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run lint, unit tests, and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean lint testDebugUnitTest assembleDebug

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

  emulator-boot-test:
    name: Android 16 Emulator Boot Test (requires KVM)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 emulator packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64" \
            "emulator"

      - name: Prepare CI diagnostics directory
        run: mkdir -p app/build/outputs/ci

      - name: Verify Hardware Acceleration (KVM Gate)
        id: kvm_gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/ci
          {
            echo "=== RAIN KVM / Acceleration Gate ==="
            echo "Runner: $(uname -a)"
            echo "User: $(id)"
            echo "KVM device before permission change:"
            ls -l /dev/kvm 2>&1 || true
            echo "Loaded KVM modules (lsmod):"
            lsmod | grep -E '^kvm' || echo "No KVM module listed by lsmod"
            echo "KVM sysfs modules:"
            ls -d /sys/module/kvm* 2>/dev/null || echo "No /sys/module/kvm* entries"
            echo "CPU virtualization flags:"
            grep -m 1 -oE 'vmx|svm' /proc/cpuinfo | sort -u || true
          } | tee app/build/outputs/ci/kvm-device.txt

          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or is not a character device."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm | tee app/build/outputs/ci/kvm-permissions-after.txt
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ] || ! (exec 3<>/dev/kvm); then
            echo "::error::Cannot read/write /dev/kvm after permission adjustment."
            exit 1
          fi

          if ! lsmod | grep -qE '^kvm' && ! compgen -G '/sys/module/kvm*' > /dev/null; then
            echo "::error::KVM module not detected in lsmod or /sys/module."
            exit 1
          fi

          if ! grep -qE '\b(vmx|svm)\b' /proc/cpuinfo; then
            echo "::error::CPU virtualization flag vmx/svm is not exposed."
            exit 1
          fi

          EMULATOR_BIN="$ANDROID_SDK_ROOT/emulator/emulator"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "::error::Emulator binary not found."
            exit 1
          fi

          set +e
          printf 'no\n' | "$EMULATOR_BIN" -accel-check 2>&1 | tee app/build/outputs/ci/kvm-accel-check.log
          accel_status=${PIPESTATUS[1]}
          set -e
          echo "emulator -accel-check exit status: $accel_status" | tee -a app/build/outputs/ci/kvm-accel-check.log
          if ! grep -Fq "is installed and usable" app/build/outputs/ci/kvm-accel-check.log; then
            echo "::error::KVM is not confirmed usable; TCG fallback is prohibited."
            exit 1
          fi
          echo "KVM / Hardware Acceleration check passed."

      - name: Upload KVM acceleration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-kvm-accel-check-boot
          path: |
            app/build/outputs/ci/kvm-device.txt
            app/build/outputs/ci/kvm-permissions-after.txt
            app/build/outputs/ci/kvm-accel-check.log
          if-no-files-found: warn
          retention-days: 14

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: rain-android-build
          path: downloaded-build

      - name: Boot Android 16 and verify RAIN launch
        if: steps.kvm_gate.outcome == 'success'
        id: boot_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          cores: 4
          ram-size: 3072M
          heap-size: 1024M
          disk-size: 6G
          emulator-boot-timeout: 300
          script: |
            set -euo pipefail
            mkdir -p app/build/outputs/ci
            echo "=== ADB device readiness ==="
            adb wait-for-device
            DEVICE=""
            for attempt in $(seq 1 30); do
              DEVICE="$(adb devices | awk '/emulator-[0-9]+[[:space:]]+device$/ {print $1; exit}')"
              if [ -n "$DEVICE" ]; then break; fi
              sleep 2
            done
            if [ -z "$DEVICE" ]; then
              echo "::error::No online Android emulator device."
              adb devices -l
              exit 1
            fi
            echo "Online device: $DEVICE"

            echo "=== Wait for Android boot (300 seconds) ==="
            boot_ready=0
            for attempt in $(seq 1 150); do
              boot_state="$(adb -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$boot_state" = "1" ]; then boot_ready=1; break; fi
              sleep 2
            done
            if [ "$boot_ready" -ne 1 ]; then
              echo "::error::Android boot did not complete within 300 seconds."
              exit 1
            fi
            echo "Android boot completed."

            echo "=== Verify Package Manager ==="
            pm_ready=0
            for attempt in $(seq 1 30); do
              if adb -s "$DEVICE" shell pm list packages 2>/dev/null | grep -q '^package:android$'; then
                pm_ready=1
                break
              fi
              sleep 2
            done
            if [ "$pm_ready" -ne 1 ]; then
              echo "::error::Package Manager did not become responsive."
              exit 1
            fi

            echo "=== Install RAIN debug APK ==="
            APK_PATH="downloaded-build/app/build/outputs/apk/debug/app-debug.apk"
            if [ ! -f "$APK_PATH" ]; then
              APK_PATH="downloaded-build/app-debug.apk"
            fi
            if [ ! -f "$APK_PATH" ]; then
              echo "::error::Debug APK artifact not found."
              find downloaded-build -maxdepth 5 -type f -print
              exit 1
            fi
            adb -s "$DEVICE" install -r "$APK_PATH"
            adb -s "$DEVICE" shell pm list packages | grep -q '^package:com.rain.browser$'

            echo "=== Launch MainActivity ==="
            adb -s "$DEVICE" shell am start -W -n com.rain.browser/.MainActivity | tee app/build/outputs/ci/main-activity-launch.txt
            grep -q 'Status: ok' app/build/outputs/ci/main-activity-launch.txt

            echo "=== Verify app process and WebView stability ==="
            sleep 5
            if ! adb -s "$DEVICE" shell pidof com.rain.browser >/dev/null 2>&1; then
              echo "::error::RAIN process is not running after MainActivity launch."
              exit 1
            fi
            adb -s "$DEVICE" logcat -d -v threadtime > app/build/outputs/ci/boot-logcat.txt
            if grep -Eiq 'Fatal signal [0-9]+|SIGTRAP|SIGSEGV|FATAL EXCEPTION|chromium.*(crash|fatal)' app/build/outputs/ci/boot-logcat.txt; then
              echo "::error::Crash signature detected during RAIN/WebView startup."
              exit 1
            fi
            echo "Android 16 Emulator Boot Test passed."

      - name: Collect Android boot diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p app/build/outputs/ci
          adb devices -l > app/build/outputs/ci/adb-devices.txt 2>&1 || true
          adb logcat -d -v threadtime > app/build/outputs/ci/boot-logcat.txt 2>&1 || true
          adb shell dumpsys activity activities > app/build/outputs/ci/boot-activity-dump.txt 2>&1 || true
          adb shell getprop > app/build/outputs/ci/boot-getprop.txt 2>&1 || true
          adb shell pm list packages > app/build/outputs/ci/boot-packages.txt 2>&1 || true
          adb shell ps -A > app/build/outputs/ci/boot-process-list.txt 2>&1 || true

      - name: Upload Android boot test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-boot-test
          path: app/build/outputs/ci/**
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Android Private Browsing Instrumentation (requires KVM)
    runs-on: ubuntu-24.04
    needs: [build, emulator-boot-test]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 emulator packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64" \
            "emulator"

      - name: Prepare CI diagnostics directory
        run: mkdir -p app/build/outputs/ci

      - name: Verify Hardware Acceleration (KVM Gate)
        id: kvm_gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/ci
          {
            echo "=== RAIN KVM / Acceleration Gate ==="
            echo "Runner: $(uname -a)"
            echo "User: $(id)"
            echo "KVM device before permission change:"
            ls -l /dev/kvm 2>&1 || true
            echo "Loaded KVM modules (lsmod):"
            lsmod | grep -E '^kvm' || echo "No KVM module listed by lsmod"
            echo "KVM sysfs modules:"
            ls -d /sys/module/kvm* 2>/dev/null || echo "No /sys/module/kvm* entries"
            echo "CPU virtualization flags:"
            grep -m 1 -oE 'vmx|svm' /proc/cpuinfo | sort -u || true
          } | tee app/build/outputs/ci/kvm-device.txt

          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or is not a character device."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm | tee app/build/outputs/ci/kvm-permissions-after.txt
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ] || ! (exec 3<>/dev/kvm); then
            echo "::error::Cannot read/write /dev/kvm after permission adjustment."
            exit 1
          fi

          if ! lsmod | grep -qE '^kvm' && ! compgen -G '/sys/module/kvm*' > /dev/null; then
            echo "::error::KVM module not detected in lsmod or /sys/module."
            exit 1
          fi

          if ! grep -qE '\b(vmx|svm)\b' /proc/cpuinfo; then
            echo "::error::CPU virtualization flag vmx/svm is not exposed."
            exit 1
          fi

          EMULATOR_BIN="$ANDROID_SDK_ROOT/emulator/emulator"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "::error::Emulator binary not found."
            exit 1
          fi

          set +e
          printf 'no\n' | "$EMULATOR_BIN" -accel-check 2>&1 | tee app/build/outputs/ci/kvm-accel-check.log
          accel_status=${PIPESTATUS[1]}
          set -e
          echo "emulator -accel-check exit status: $accel_status" | tee -a app/build/outputs/ci/kvm-accel-check.log
          if ! grep -Fq "is installed and usable" app/build/outputs/ci/kvm-accel-check.log; then
            echo "::error::KVM is not confirmed usable; TCG fallback is prohibited."
            exit 1
          fi
          echo "KVM / Hardware Acceleration check passed."

      - name: Upload KVM acceleration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-kvm-accel-check-instrumentation
          path: |
            app/build/outputs/ci/kvm-device.txt
            app/build/outputs/ci/kvm-permissions-after.txt
            app/build/outputs/ci/kvm-accel-check.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run Android instrumentation tests on emulator
        if: steps.kvm_gate.outcome == 'success'
        id: instrumentation_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          cores: 4
          ram-size: 3072M
          heap-size: 1024M
          disk-size: 6G
          emulator-boot-timeout: 300
          script: |
            set +e
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
            gradle_status=$?
            mkdir -p app/build/outputs/ci
            adb devices -l > app/build/outputs/ci/instrumentation-adb-devices.txt 2>&1 || true
            adb logcat -d -v threadtime > app/build/outputs/ci/instrumentation-logcat.txt 2>&1 || true
            adb shell dumpsys activity activities > app/build/outputs/ci/instrumentation-activity-dump.txt 2>&1 || true
            adb shell dumpsys activity lastanr > app/build/outputs/ci/instrumentation-last-anr.txt 2>&1 || true
            adb shell dumpsys dropbox --print > app/build/outputs/ci/instrumentation-dropbox.txt 2>&1 || true
            adb shell ps -A > app/build/outputs/ci/instrumentation-process-list.txt 2>&1 || true
            if [ -d app/build/outputs/androidTest-results/connected ]; then
              if grep -RqsE '<failure>|<error>' app/build/outputs/androidTest-results/connected; then
                echo "Instrumentation XML contains failures or errors"
                gradle_status=1
              elif ! grep -RqsE '<testsuite[^>]*tests="[1-9][0-9]*"' app/build/outputs/androidTest-results/connected; then
                echo "No completed instrumentation test cases were reported"
                gradle_status=1
              fi
            else
              echo "Instrumentation test result directory is missing"
              gradle_status=1
            fi
            exit "$gradle_status"

      - name: Upload instrumentation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-instrumentation
          path: |
            app/build/outputs/apk/androidTest/**
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/ci/**
          if-no-files-found: warn
          retention-days: 14
