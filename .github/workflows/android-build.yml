name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Unit Tests, and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew
      - name: Run lint, unit tests, and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean lint testDebugUnitTest assembleDebug
      - name: Run Android instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          boot-timeout: 900
          script: |
            adb devices
            adb shell getprop sys.boot_completed
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
