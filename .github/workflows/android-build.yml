name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, phase2/video-detection-poc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Unit Tests, Android 16 Instrumentation, and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "emulator"
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew
      - name: Run lint, unit tests, and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean lint testDebugUnitTest assembleDebug
      - name: Verify KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::KVM device is unavailable; Android 16 emulator tests cannot use the required hardware acceleration."
            exit 2
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM device is not readable and writable by the runner."
            exit 2
          fi
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
      - name: Run Android 16 instrumentation and install-launch smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -accel on -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6G
          emulator-boot-timeout: 900
          script: |
            adb devices
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "36"
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            # Run deterministic fixtures on every CI build.
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.rain.browser.browser.Html5VideoDetectionProbeTest
            # Run the approved read-only real-site probe only for its dedicated Day 8 branch.
            if [ "${GITHUB_HEAD_REF:-}" = "phase2/day8-real-site-feasibility-probe" ]; then
              mkdir -p app/build/reports
              adb logcat -c
              set +e
              ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.rain.browser.browser.RealSiteVideoFeasibilityProbeTest
              probe_status=$?
              adb logcat -d -s RAIN_DAY8_SITE_PROBE:I > app/build/reports/day8-real-site-probe.log
              set -e
              if [ "$probe_status" -ne 0 ]; then
                exit "$probe_status"
              fi
            fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.rain.browser
            adb shell monkey -p com.rain.browser 1
            sleep 2
            adb shell pidof com.rain.browser
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
            app/build/reports/day8-real-site-probe.log
          if-no-files-found: warn
          retention-days: 14
