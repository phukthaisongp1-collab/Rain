name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Unit Tests, and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run lint, unit tests, and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean lint testDebugUnitTest assembleDebug

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Android Instrumentation (requires KVM)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages (including emulator)
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64" \
            "emulator"

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare CI diagnostics directory
        run: mkdir -p app/build/outputs/ci

      - name: Verify Hardware Acceleration (KVM Gate)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RAIN KVM / Acceleration Gate ==="
          {
            echo "Runner: $(uname -a)"
            echo "User: $(id)"
            echo
            echo "KVM device:"
            ls -l /dev/kvm 2>&1 || true
          } | tee app/build/outputs/ci/kvm-device.txt

          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or is not a character device."
            echo "Hardware acceleration is required for Android 16 instrumentation tests."
            echo "TCG (software emulation) is not accepted for RAIN Browser Day 31 verification."
            exit 1
          fi

          if ! (exec 3<>/dev/kvm); then
            echo "::error::The current runner user cannot open /dev/kvm for read/write."
            echo "A runner with working KVM permissions is required. TCG fallback is prohibited."
            exit 1
          fi

          if ! command -v emulator >/dev/null 2>&1; then
            echo "::error::emulator binary not found after Android SDK installation."
            exit 1
          fi

          echo "Running emulator -accel-check..."
          if ! emulator -accel-check 2>&1 | tee app/build/outputs/ci/accel-check.txt; then
            echo "::error::emulator -accel-check failed. Hardware acceleration is unavailable."
            echo "This runner must not launch the Android 16 emulator using TCG."
            exit 1
          fi

          echo "KVM / Hardware Acceleration check passed."

      - name: Run Android instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6G
          emulator-boot-timeout: 1200
          script: |
            bash -c '
              set +e
              adb devices
              adb shell getprop sys.boot_completed
              ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
              gradle_status=$?
              mkdir -p app/build/outputs/ci
              adb logcat -d -v threadtime > app/build/outputs/ci/emulator-logcat.txt 2>&1 || true
              adb shell dumpsys activity activities > app/build/outputs/ci/activity-dump.txt 2>&1 || true
              adb shell dumpsys activity lastanr > app/build/outputs/ci/last-anr.txt 2>&1 || true
              adb shell dumpsys dropbox --print > app/build/outputs/ci/dropbox.txt 2>&1 || true
              adb shell ps -A > app/build/outputs/ci/process-list.txt 2>&1 || true
              if [ -d app/build/outputs/androidTest-results/connected ]; then
                if grep -RqsE "<failure>|<error>" app/build/outputs/androidTest-results/connected; then
                  echo "Instrumentation XML contains failures or errors"
                  gradle_status=1
                elif ! grep -RqsE "<testsuite[^>]*tests=\"[1-9][0-9]*\"" app/build/outputs/androidTest-results/connected; then
                  echo "No completed instrumentation test cases were reported"
                  gradle_status=1
                fi
              else
                echo "Instrumentation test result directory is missing"
                gradle_status=1
              fi
              exit "$gradle_status"
            '

      - name: Upload instrumentation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-android-instrumentation
          path: |
            app/build/outputs/apk/androidTest/**
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/ci/**
          if-no-files-found: warn
          retention-days: 14
